; Project-local PHP configuration for the backend.
; Use it with: php -c backend/php.ini -S 127.0.0.1:8000 -t backend/public backend/public/index.php
;
; The global php.ini sits outside this workspace, so project settings live here.
; extension_dir below is this machine's PHP install; update it if PHP moves.
;
; MongoDB needs the pecl "mongodb" extension, which this PHP build does not ship.
; backend/ext/php_mongodb.dll is the official windows.php.net PECL build
; 2.5.5 for PHP 8.3 / TS / VS16 / x64 — it matches "php -i" exactly, and an NTS
; or mismatched-API build would fail to load. Loaded by absolute path below so
; nothing is written into the PHP install directory. To undo: delete the DLL and
; this extension line.

[PHP]
extension_dir = "C:/Users/hp/AppData/Local/Microsoft/WinGet/Packages/PHP.PHP.8.3_Microsoft.Winget.Source_8wekyb3d8bbwe/ext"

extension = mbstring
extension = openssl
extension = curl
extension = fileinfo
extension = "C:/Php-Project/backend/ext/php_mongodb.dll"

date.timezone = Asia/Kolkata
memory_limit = 512M
max_execution_time = 0
